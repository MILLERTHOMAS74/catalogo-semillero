<div class="container my-4">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1>Catálogo de Productos - Semillero</h1>
    <div>
      <button class="btn btn-outline-secondary me-3" (click)="alternarRol()">
        Cambiar Rol (Actual: <strong>{{ rolActual() }}</strong>)
      </button>
      <span class="badge bg-success fs-6">🛒 Carrito: {{ cantidadItemsCarrito() }} items (${{ totalCarrito() }})</span>
    </div>
  </header>

  <!-- Filtros -->
  <div class="mb-4">
    <span class="me-2 fw-bold">Categorías:</span>
    @for (cat of categoriasDisponibles(); track cat) {
      <button 
        class="btn btn-sm me-2" 
        [class.btn-dark]="categoriaSeleccionada() === cat"
        [class.btn-outline-dark]="categoriaSeleccionada() !== cat"
        (click)="cambiarCategoria(cat)">
        {{ cat }}
      </button>
    }
  </div>

  <!-- Vista en Tarjetas -->
  <h3 class="mb-3">Vista de Tarjetas</h3>
  <div class="row">
    @for (prod of productosFiltrados(); track prod.id) {
      <div class="col-md-4">
        <app-tarjeta-producto 
          [producto]="prod" 
          [rol]="rolActual()"
          (agregarCarrito)="agregarAlCarrito($event)"
          (editar)="editarProducto($event)"
          (eliminar)="eliminarProducto($event)">
        </app-tarjeta-producto>
      </div>
    }
  </div>

  <!-- Vista en Tabla -->
  <h3 class="mt-5 mb-3">Vista de Tabla</h3>
  <app-tabla-productos 
    [productos]="productosFiltrados()" 
    [rol]="rolActual()"
    (editar)="editarProducto($event)"
    (eliminar)="eliminarProducto($event)">
  </app-tabla-productos>
</div>
