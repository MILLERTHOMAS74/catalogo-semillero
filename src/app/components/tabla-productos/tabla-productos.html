<div class="table-container">
  <table *ngIf="productos.length > 0; else sinDatos">
    <thead>
      <tr>
        <th>ID</th>
        <th>Miniatura</th>
        <th>Título</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos; trackBy: trackByProductoId">
        <td>{{ p.id }}</td>
        <td><img [src]="p.images[0]" class="mini" /></td>
        <td>{{ p.title }}</td>
        <td>{{ p.category.name }}</td>
        <td>${{ p.price }}</td>
        <td>{{ p.stock }}</td>
        <td>
          <button class="btn-edit" (click)="editar.emit(p)">Editar</button>
          <button class="btn-del" (click)="eliminar.emit(p)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #sinDatos>
    <div class="vacio">No hay productos para mostrar en este momento.</div>
  </ng-template>
</div>
