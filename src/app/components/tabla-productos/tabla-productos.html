<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Imagen</th>
        <th>Título</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
        @if (rol() === 'admin') {
          <th>Acciones</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (p of productos(); track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td><img [src]="p.images[0]" width="50" height="50" style="object-fit: cover;" class="rounded"></td>
          <td>{{ p.title }}</td>
          <td>{{ p.category.name }}</td>
          <td>${{ p.price }}</td>
          <td>{{ p.stock }}</td>
          @if (rol() === 'admin') {
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" (click)="editar.emit(p)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="eliminar.emit(p)">Eliminar</button>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
